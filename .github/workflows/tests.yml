name: deterministic-contract-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,excel]'
      - run: sudo apt-get update && sudo apt-get install -y inkscape fonts-noto-cjk
      - run: python -m cumcm_harness verify-vendor
      - run: python -m pytest -q --ignore=tests/test_algorithm_upgrade.py --ignore=tests/test_algorithm_integration.py --ignore=tests/test_audit_20260908_graph_overflow.py --junitxml=reports/ci-infrastructure.xml
      - run: docker build -t cumcm-egoharness:0.5.0-rc3 .
      - run: docker build -f Dockerfile.test -t cumcm-egoharness:0.5.0-rc3-test .
      - run: docker build -f Dockerfile.tex -t cumcm-egoharness-tex:0.3.1 .
      - run: docker build -f Dockerfile.paperkit-test -t cumcm-paperkit-validation:1.0.0 .
      - run: python scripts/validate_paperkit.py --out reports/ci-paperkit-validation
      - run: python scripts/validate_materials_pipeline.py --out workspaces/ci-materials-legacy
      - run: python scripts/validate_materials_pipeline.py --out workspaces/ci-materials-legacy --replay
      - run: python scripts/validate_materials_pipeline.py --out workspaces/ci-materials-r2 --r2
      - run: python scripts/validate_materials_pipeline.py --out workspaces/ci-materials-r2 --r2 --replay
      - run: python scripts/validate_support_reproduction.py --workspace workspaces/ci-materials-r2 --out reports/ci-support-reproduction
      - run: python -m cumcm_harness.exa_r2_demo workspaces/ci-r2-legacy-regression
      - run: python scripts/validate_paper_repair.py --workspace workspaces/ci-paperkit-repair --report reports/ci-paperkit-repair.json
      - run: python scripts/validate_audit_isolation.py --out reports/ci-isolation-validation
      - run: python scripts/validate_algorithm_upgrade.py --out reports/ci-algorithm-validation --seeds 2 --seed-start 201
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-validation-evidence
          path: |
            reports/ci-infrastructure.xml
            reports/ci-paperkit-validation/summary.json
            reports/ci-paperkit-validation/reference/reference-tests.xml
            reports/ci-paperkit-validation/reference-logs/*.log
            reports/ci-paperkit-validation/*/preflight.json
            reports/ci-paperkit-repair.json
            reports/ci-support-reproduction/summary.json
            workspaces/ci-materials-*/materials-validation.json
            workspaces/ci-materials-*/materials-replay.json
            workspaces/ci-materials-*/paper/preflight.json
            workspaces/ci-materials-*/paper/ai_details_preflight.json
            workspaces/ci-materials-*/deliverables/submission-manifest.json
            workspaces/ci-r2-legacy-regression/resilience_acceptance.json
            reports/ci-isolation-validation/summary.json
            reports/ci-algorithm-validation/*.json
            reports/ci-algorithm-validation/tests/*.xml
            reports/ci-algorithm-validation/*-logs/*.log
            reports/ci-algorithm-validation/lab-*/*.json
# Numerical code executes in the existing restricted Docker executor. These
# bounded diagnostics do not establish live LLM/Exa or competition quality.
