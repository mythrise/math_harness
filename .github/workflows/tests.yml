name: deterministic-contract-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,excel]'
      - run: python -m cumcm_harness verify-vendor
      - run: python -m pytest -q --junitxml=reports/ci-tests.xml
# This job does not claim live CLI authentication, Docker execution or competition
# quality. Run those separately under explicit credentials and a frozen protocol.
