name: three-input-modes
on:
  push:
    paths: ['cumcm_harness/**', '.agents/**', 'tests/**', 'scripts/**', '.github/workflows/three-inputs.yml', 'pyproject.toml', 'schemas/**', 'configs/**', 'Dockerfile*', 'templates/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-frozen-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,excel]'
      - run: |
          sudo apt-get update
          sudo apt-get install -y inkscape fonts-noto-cjk
      - run: python -m pytest -q tests/test_three_inputs_*.py tests/test_v050_remediation.py tests/test_revision_actual_layout.py tests/test_claude_wait_policy.py --junitxml=reports/three-input-tests.xml
      - run: python -m cumcm_harness verify-vendor
      - run: docker build -t cumcm-egoharness:0.5.0-rc2 .
      - run: docker build -f Dockerfile.tex -t cumcm-egoharness-tex:0.3.1 .
      - run: docker build -f Dockerfile.test -t cumcm-egoharness:0.5.0-rc2-test .
      - run: docker build -f Dockerfile.document-test -t cumcm-egoharness:0.5.0-rc2-documents .
      - name: Full fixed-response idea and scratch pipelines with frozen R2
        run: |
          for MODE in idea scratch; do
            python scripts/validate_three_inputs.py --out workspaces/three-input-$MODE --input-mode "$MODE" --r2
            python scripts/validate_three_inputs.py --out workspaces/three-input-$MODE --input-mode "$MODE" --r2 --replay
          done
      - name: Editorial mode and replay
        run: |
          python scripts/validate_three_inputs.py --out workspaces/three-input-revise --input-mode revise
          python scripts/validate_three_inputs.py --out workspaces/three-input-revise --input-mode revise --replay
      - run: python -m cumcm_harness audit workspaces/three-input-revise
      - run: python scripts/validate_support_reproduction.py --workspace workspaces/three-input-idea --out reports/three-input-support
      - run: python scripts/validate_document_revision.py --out reports/three-input-documents
      - run: python scripts/validate_tex_revision.py --out reports/three-input-tex --whole-source workspaces/three-input-idea/paper/main.tex
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-input-validation-evidence
          path: |
            reports/three-input-tests.xml
            reports/three-input-support/summary.json
            reports/three-input-documents/summary.json
            reports/three-input-documents/output/render-*/page-*.png
            reports/three-input-tex/summary.json
            reports/three-input-tex/*/renders/*.png
            workspaces/three-input-*/three-input-*.json
            workspaces/three-input-*/blocker.json
            workspaces/three-input-*/revision_summary.json
            workspaces/three-input-*/ideas/public_summary.json
            workspaces/three-input-*/paper/preflight.json
            workspaces/three-input-*/deliverables/submission-manifest.json
